# Run matrix: copy to a run directory OUTSIDE the repository and fill it in.
# The loop reads it; the validator owns `thresholds`; the human owns `budget` and `scope`.
# Cell status is never typed here: it is computed from cells/<cell>/**/verdict.json.
schema: trtllm-serve-model-harness/matrix@1
run_id: null                       # e.g. mh-20261021-a; reused across sessions, never reset
run_dir: null                      # evidence lives in <run_dir>/cells/<cell>/<stage>/<iteration>/,
                                   # and cells/<cell>/log.md has one line per iteration (SKILL.md 4a)
integration_branch: null           # the code under test; every verdict binds a build_id from it

scope:                             # human decisions, recorded verbatim with date
  models: [glm-5, kimi-k3, deepseek-v41]          # ids in profiles/model/
  harnesses: [codex-kf, claude-code, pi-chat]     # ids in profiles/harness/
  checkpoints: {}                  # model id -> checkpoint name and template hash actually served
  support_means: conformance+model-behavior+harness-outcome   # task-outcome needs an oracle
  decided_by: null

cells:                             # one entry per (model, harness); protocol comes from the harness
  - {model: deepseek-v41, harness: codex-kf}
  - {model: deepseek-v41, harness: claude-code}
  - {model: deepseek-v41, harness: pi-chat}
  - {model: glm-5, harness: codex-kf}
  - {model: glm-5, harness: claude-code}
  - {model: glm-5, harness: pi-chat}
  - {model: kimi-k3, harness: codex-kf}
  - {model: kimi-k3, harness: claude-code}
  - {model: kimi-k3, harness: pi-chat}

thresholds:                        # validator-owned; unknown -> the claim is BLOCKED
  conformance: zero                # any confirmed violation fails
  views_equal: 1.0
  model_behavior:                  # one-sided 95% Wilson upper bound must be <= value
    undeclared_call_rate: null
    payload_invalid_rate: null
    degenerate_rate: null
    markup_leak_rate: null
    empty_turn_rate: null
  harness_outcome:
    aborted_rate: null
    arguments_rejected_rate: null
    resends_caused_by_us: zero
    unattributed_disconnects: zero
  unit_for_rates: session          # session | turn | call (sessions are the independent unit)

budget:                            # human-owned; unknown is not unlimited
  repair_cycles_per_finding_class: 3
  gpu: {}                          # e.g. deepseek-v41: "1x4 GB300 node, 2 days"
  wall_clock: null

validator:
  agent: null                      # a different session, ideally a different vendor
  tree_sha256: null                # scripts/validate + validator-owned references
  controls_receipt: null           # path to the passing control matrix for that tree

escalation:                        # always to the human
  - resources beyond budget
  - pushes, PRs, upstream issues
  - policy choices (e.g. serving behavior when the model breaks a constraint)
  - thresholds
  - exhausted budget or a repeated blocker
