# Harness profile: Codex as Kernel Factory runs it (behind KF's in-pod LiteLLM gateway).
# Derived from contracts/codex-kf.md. The validator reads this file; edits are policy changes.
schema: trtllm-serve-model-harness/harness-profile@1
id: codex-kf
harness: codex
version: KF build, measured 2026-10-16
configuration: kernel-factory
contract: contracts/codex-kf.md
status: measured            # measured | doc-only | draft
protocol: responses
routes:
  - {method: POST, path: /v1/responses, stream: always}

identity:                    # where the turn record takes session/thread/agent from
  session: {body: prompt_cache_key}          # the PARENT session; sub-agents share it
  thread: {body: client_metadata.thread_id}  # group conversations by this
  agent: {body_json: client_metadata.x-codex-turn-metadata, key: agent_name}

request:
  model_field: client-chosen  # always gpt-5.6-sol; route on pools, never on this
  always_present: [model, input, include, parallel_tool_calls, reasoning, store, text,
                   tool_choice, prompt_cache_key, client_metadata]
  must_accept: [service_tier, client_metadata, include, store, text]

tools:
  declared_in: [additional_tools]           # no top-level tools, no instructions field
  namespaces: true                          # functions.*, collaboration.*
  custom_tools: true                        # functions.exec: Lark grammar, freeform input
  nested:                                   # callable only through exec
    via: functions.exec
    from: description_headers               # names under "### `name`" in exec's description
    known: [exec_command, apply_patch, write_stdin, view_image, create_goal, get_goal, update_goal]
  name_spellings: [bare, qualified]         # models write both; serving resolves both
parallel_tool_calls: always_false

outcomes:                     # matched against *_call_output.output text, first match wins
  aborted: {exact: aborted}
  unsupported: {prefix: "unsupported call:"}
  arguments_rejected: {prefix: "failed to parse function arguments"}
  unavailable_in_mode: {regex: 'is unavailable in (\w+) mode'}

errors:
  overlength: {shape: in_stream, event: response.failed, code: context_length_exceeded}
  http_400_effect: resend     # a 400 is terminal in source, yet the KF build resent it 6 times

timeouts:
  first_event_s: 120          # KF/Codex cut a silent stream at about 120 s
  idle_s: 120

echo:                       # what the next request carries back of our reply (C-03)
  text: exact               # batch-010: 36,567 message texts echoed by id, 0 differed, 22 missing
  reasoning: TODO           # reasoning items carry encrypted_content, not the text

reasoning:
  carrier: encrypted_content  # include: [reasoning.encrypted_content]; replayed every turn
  request: {reasoning: {context: all_turns}}   # no effort in the KF config

stream:
  records_items_on: response.output_item.done
  needs_status: [message]     # custom_tool_call has no status field

compaction:
  trigger: model_context_window reached, or in-stream context_length_exceeded
