# Harness profile: Codex as Kernel Factory runs it for a BYOM model (`kf campaign start
# --llm-endpoint <yours> --llm-endpoint-api responses`, agent `codex:<model>`). Measured
# 2026-10-27 from the first requests of a DeepSeek-V4.1-Flash campaign (kf 1.1.6). It is the
# default-config contract (contracts/codex-default.md), not the managed-model one (codex-kf):
# top-level JSON function tools, an `instructions` field, parallel_tool_calls true. The validator
# reads this file; edits are policy changes.
schema: trtllm-serve-model-harness/harness-profile@1
id: codex-kf-byom
harness: codex
version: KF BYOM (kf 1.1.6), measured 2026-10-27; the Codex version is not visible (the gateway strips user-agent)
configuration: kernel-factory BYOM, responses API
contract: contracts/codex-default.md
status: measured
protocol: responses
routes:
  - {method: POST, path: /v1/responses, stream: always}

identity:
  session: {body: prompt_cache_key}
  thread: {body: client_metadata.thread_id}
  agent: {body_json: client_metadata.x-codex-turn-metadata, key: agent_name}

request:
  model_field: served-name      # the BYOM model id (deepseek-v4.1-flash)
  always_present: [model, input, include, instructions, parallel_tool_calls, reasoning, store, stream,
                   tool_choice, tools, prompt_cache_key, client_metadata]
  must_accept: [client_metadata, include, store, instructions]

tools:
  declared_in: [tools]                      # top-level JSON functions; no additional_tools item
  namespaces: true                          # multi_agent_v1.*
  custom_tools: false
  known: [exec_command, write_stdin, request_user_input, view_image, get_goal, create_goal, update_goal,
          web_search]
  nested: null
parallel_tool_calls: true                   # sent as true on every request: nothing to enforce

outcomes:                                   # the same client code as codex-kf
  aborted: {exact: aborted}
  unsupported: {prefix: "unsupported call:"}
  arguments_rejected: {prefix: "failed to parse function arguments"}
  unavailable_in_mode: {regex: 'is unavailable in (\w+) mode'}

errors:
  overlength: {shape: in_stream, event: response.failed, code: context_length_exceeded}

timeouts:                     # not measured on this path: carried over from codex-kf (KF's gateway cut a
  first_event_s: 120          # silent stream at about 120 s); the server's keepalive repeats
  idle_s: 120                 # response.in_progress every 15 s

echo:
  text: exact                 # codex-rs replays message items by id (36,567 of 36,567 equal on codex-kf)
  reasoning: exact            # by id, the carrier (encrypted_content) by value: codex-rs keeps the item as received

reasoning:
  carrier: encrypted_content  # include: [reasoning.encrypted_content], store: false
  request: {reasoning: {summary: auto}}   # no effort: the server's default applies

stream:
  records_items_on: response.output_item.done

compaction:
  trigger: model_context_window reached, or in-stream context_length_exceeded
