# Harness profile: Claude Code as a Kernel Factory campaign agent (runtime `claude`), whose model
# traffic KF's proxy sends to a BYOM endpoint served by trtllm-serve (`--llm-endpoint-api native`).
# Same client as claude-code.yaml, but the proxy keeps only anthropic-version, anthropic-beta and
# its own x-kf-* headers: Claude Code's x-claude-code-* headers and user-agent never arrive.
schema: trtllm-serve-model-harness/harness-profile@1
id: claude-code-kf
harness: claude-code
version: "2.1.290-2.1.303"   # inferred 2026-10-26; KF exposes no version. It sends prompt-caching-scope,
                             # which 2.1.307 stopped sending behind custom gateways, and no tool search,
                             # on by default behind them since 2.1.304. Timeouts and capability matchers
                             # are the same in 2.1.289 and 2.1.309, so the range does not change them
configuration: kf campaign start --llm-endpoint <name> --llm-endpoint-api native
contract: contracts/claude-code.md
status: partial             # first KF campaign 2026-10-23 (DeepSeek-V4.1-Flash); identity from KF headers + body
protocol: anthropic-messages
routes:                     # measured 2026-10-23: only these reach the endpoint through KF's proxy
  - {method: POST, path: /v1/messages, stream: always}
  - {method: POST, path: /v1/messages/count_tokens, optional: true}

identity:                   # x-claude-code-* headers are dropped by KF's proxy
  session: {header: x-kf-agent-run-id}                    # one Claude Code process per KF agent run
  thread: {body_json: metadata.user_id, key: session_id}  # Claude Code's own session id
  campaign: {header: x-kf-campaign-id}
  round: {header: x-kf-round}
  agent: TODO               # no sub-agent header arrives; record how sub-agent requests differ

request:
  model_field: from ANTHROPIC_MODEL / ANTHROPIC_DEFAULT_*_MODEL
  unknown_model_capabilities: full   # thinking adaptive, output_config, context_management,
                                     # mid-conversation role:system, cache_control, beta tool fields
  must_accept:
    - anthropic-beta header (open list)
    - thinking
    - output_config
    - context_management
    - cache_control
    - metadata
    - system as an array
    - "messages[].role: system"
    - "tools[].strict"
    - "tools[].defer_loading"
    - tool_reference blocks
  system_attribution_block: first system block; stable per conversation since v2.1.181;
                            CLAUDE_CODE_ATTRIBUTION_HEADER=0 removes it

tools:
  declared_in: [tools]
  namespaces: false
  custom_tools: false
  server_tools: TODO        # e.g. web search; record what reaches the endpoint
parallel_tool_calls: TODO   # does it ever send disable_parallel_tool_use? main rejects it with a 400

outcomes:                   # tool_result blocks by tool_use_id; measured 2026-10-22 (2.1.289,
                            # fake server): all three carry is_error: true, so order matters
  unsupported: {contains: "No such tool available"}    # <tool_use_error>Error: No such tool available: NAME</tool_use_error>
  arguments_rejected: {contains: "InputValidationError"}  # <tool_use_error>InputValidationError: ...</tool_use_error>
  tool_error: {is_error: true}                         # the tool ran and failed, e.g. "File does not exist."

errors:
  overlength: {shape: http_400, error_type: invalid_request_error, wording: "prompt is too long",
               status: TODO}    # reactive compaction depends on the wording; main says otherwise
  capability_retries:          # measured 2026-10-26 from the matchers in the 2.1.289 and 2.1.309
                               # binaries (the same in both unless noted): a 400 whose message matches
                               # makes Claude Code drop that capability and retry
    - {field: thinking.display, wording: "Unknown parameter: 'thinking.adaptive.display'"}
                               # display "updates": ANY 400 no other rule claims is retried once without
                               # it, and it is not sent again in that conversation; this wording is main's
    - {field: thinking.display, wording: "thinking. ... .display: Input should be"}   # "highlights" -> "omitted"
    - {field: thinking.type, wording: "adaptive thinking is not supported"}
    - {field: thinking.type, wording: "thinking.type: enabled ... is not supported"}
    - {field: thinking.signature, wording: "bound to a different conversation"}
    - {field: thinking.signature, wording: "not created in this conversation"}
    - {field: thinking.signature, wording: "Invalid signature in thinking block"}
    - {field: thinking.block_binding, wording: "thinking. ... .block_binding ... Extra inputs are not permitted"}
    - {field: "messages[].role=system", wording: "Unexpected role ... input message role"}
    - {field: output_config.effort, wording: "requires a model that supports per-turn effort"}
    - {field: output_config.effort, wording: "This model does not support the effort parameter"}
    - {field: output_config, wording: "messages. ... .output_config: Extra inputs are not permitted"}
    - {field: output_config.format, wording: "output_config.format: Extra inputs are not permitted"}
    - {field: context_management, wording: "context_management: Extra inputs are not permitted"}  # 2.1.304+
  overload: {status: 529, error_type: overloaded_error}
  retry_after: integer seconds; above 60 stops automatic retries

timeouts:                   # the KF path. Claude Code's own are claude-code.yaml's (360 / 300 / 600 s)
  first_event_s: 35         # inferred 2026-10-26 from campaign trial 2: requests that got no first byte
                            # were sent again 35-38 s later (one after five tries, 201 s), far below
                            # Claude Code's 360 s, so KF's proxy or its agent image cuts at about 35 s.
                            # Confirm with a KF run against fake_agent_server slow_first_event
  idle_s: TODO              # above 31.7 s (six streams silent that long survived trial 2); KF's own cut
                            # is not measured. Claude Code's own is 300 s
  keepalive: ping

echo:                       # what the next request carries back of our reply (C-03)
  text: exact               # 2.1.289 vs fake_agent_server, 2026-10-22: blocks in order, verbatim
  reasoning: exact          # thinking text and signature, verbatim, at the appended position
  tool_input:               # 2.1.289 vs DeepSeek-V4.1-Flash, 2026-10-23 (run2, both sides): every
    - schema_defaults       # Edit came back with replace_all: false, its declared default, added (12/12)
    - cd_cwd_prefix         # every Bash `cd <session cwd> && <cmd>` came back as <cmd> (6/6); no other change

reasoning:
  carrier: thinking signature   # main emits no signature; a rejected signature makes it drop thinking
  request: {thinking: adaptive for unknown model ids}

stream:
  requires: [message_delta, message_stop]   # ending early reads as a dropped connection
  keepalive: ping

context_window:
  default_for_unknown_ids: 200000           # 1000000 when the id carries [1m]
  configure: TODO - record the model-config mechanism for a gateway or custom model id

background_tasks: main model unless ANTHROPIC_DEFAULT_HAIKU_MODEL is set

direct_egress: [fast-mode availability check, WebFetch domain safety check]   # api.anthropic.com
