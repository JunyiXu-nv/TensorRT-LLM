# Harness profile: the pi coding agent with a custom provider of api "anthropic-messages".
# pi also speaks openai-responses and anthropic-messages; each choice is a separate profile.
# Derived from contracts/pi.md. Fields marked TODO are S0 measurements (pi is open source:
# answer them from its source with file:line).
schema: trtllm-serve-model-harness/harness-profile@1
id: pi-messages
harness: pi
version: "@earendil-works/pi-coding-agent 1.4.0"   # renamed from @mariozechner/pi-coding-agent
configuration: "~/.pi/agent/models.json provider, api anthropic-messages; its baseUrl has no /v1
  because pi appends /v1/messages"
contract: contracts/pi.md
status: partial            # wiring measured 2026-10-22 (fake servers); outcomes, errors, timeouts TODO
protocol: anthropic-messages
routes:
  - {method: POST, path: /v1/messages, stream: true}   # measured

identity: {}                # measured: no session header or field over this API. Run one recorder
                            # per session with --session TAG; the validator falls back to it.

compat:                     # anthropic-messages flags (docs/models-configuration.md)
  supportsEagerToolInputStreaming: true   # measured: tools[].eager_input_streaming sent
  supportsCacheControlOnTools: true       # measured: cache_control on the last tool
  allowEmptySignature: TODO               # main emits no signature: does pi replay thinking as text?
model_entry:
  contextWindow: required            # pi defaults to 128000; set it to the served max_seq_len
  maxTokens: required                # default 16384
  reasoning: per model

tools:
  declared_in: [tools]
  known: [read, write, edit, bash]   # grep, find and ls are optional
parallel_tool_calls: not sent      # measured

outcomes:                   # partial: unknown-tool and invalid-argument strings are still open
  tool_error: {regex: "^E[A-Z]+: "}   # measured 2026-10-22: pi passes Node's error through, e.g.
                                      # "ENOENT: no such file or directory, access '<path>'"

errors:
  overlength: TODO          # pi compacts on "context overflow" and retries: record how it detects it

timeouts:
  first_event_s: TODO
  idle_s: TODO

echo:                       # what the next request carries back of our reply (C-03)
  text: exact               # 1.4.0 vs the fake servers, 2026-10-22: signed thinking, text and tool_use come back verbatim
  reasoning: exact          # main sends no signature, and pi's allowEmptySignature=false may then replay thinking as text, which C-03 reports

reasoning:
  request: {thinking: {type: enabled, budget_tokens: 3072, display: summarized}}   # measured, default level
  carrier: thinking signature

session_log: ~/.pi/agent/sessions/*.jsonl   # secondary harness-side signal
non_interactive: [--print, "--mode json", "--mode rpc"]
