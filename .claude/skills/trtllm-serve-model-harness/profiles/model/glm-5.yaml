# Model profile: GLM-5.x. One family, several checkpoints whose chat templates differ:
# pin the checkpoint and its template hash in every cell.
schema: trtllm-serve-model-harness/model-profile@1
id: glm-5
status: draft
checkpoints:
  - {name: GLM-5.2-NVFP4, model_type: glm_moe_dsa, size_gb: 465, template_sha256: 172dc74a35e1752d}
  - {name: GLM-5.3-Flash, model_type: glm5_next, size_gb: 328, template_sha256: 34d5ee66b12fa644}
  - {name: GLM-5.3-Flash-NVFP4, model_type: glm5_next, size_gb: 204, template_sha256: 34d5ee66b12fa644}
  # The campaign's checkpoint (nvidia/GLM-5.3-NVFP4 @416bdc1, on jhb): modelopt MIXED_PRECISION,
  # experts NVFP4, layers 0-2 FP8, attention and the MTP layer BF16. Fits one 4xGB300 node (the
  # fleet ran it DEP4 with MTP 3: 135.83 GiB weights per rank).
  - {name: GLM-5.3-NVFP4, model_type: glm_moe_dsa, size_gb: 464, template_sha256: 3740abcea51c4583}
upstream: "main has glm_moe_dsa and glm5_next. Its glm4/glm47 parsers were rewritten in #19935.
  glm5_next has no automatic tool-parser mapping on main. The campaign branch carries later
  parser fixes (d5c7446321, cf21507ac4, 951f41ed54, af44f3a18d, 006272aa23)."

renderer:
  kind: chat_template
  reference: chat_template.jinja
  notes:
    - "Tool calls render as <tool_call>NAME<arg_key>K</arg_key><arg_value>V</arg_value>...</tool_call>."
    - "GLM-5.2: enable_thinking switches <think></think>; GLM-5.3 and GLM-5.3-Flash always open
       <think> and write 'Reasoning Effort: Low|High|Max' (default Max) whatever enable_thinking says."
    - "developer messages must reach the template (f13c9de3a7 on the campaign branch)."

parsers:
  tool: glm47
  reasoning: glm              # what the fleet served GLM-5.3-NVFP4 with; glm47 / glm45 also registered
  family: [glm4, glm47]

format_card:
  call_open: "<tool_call>"
  name_end: "<arg_key>"
  call_close: "</tool_call>"
  block_open: null
  block_close: null
  value_open: "<arg_value>"
  value_close: "</arg_value>"
  qualified_prefix: "functions."

native:                                     # the raw view (C-13); grammar of chat_template.jinja
  kind: glm_xml
  prompt_opens: think                       # GLM-5.3 always prefills <think>
  stop_markers: ["<|user|>", "<|observation|>", "<|endoftext|>"]
  repairs:
    # The glm47 parser maps a name the model qualified wrongly (func_bp.exec,
    # functions.collaboration.list_agents) to the declared tool its last segment names.
    - qualified_name_suffix
  measured: "batch-010: 96,968 replies joined; 3 repaired names, every other difference a model
    anomaly or the single-call policy (validate.md section 8)"

markers:
  - "<tool_call>"
  - "</tool_call>"
  - "<arg_key>"
  - "</arg_key>"
  - "<arg_value>"
  - "</arg_value>"
  - "<think>"
  - "</think>"
  - "<|observation|>"
  - "<|assistant|>"
  - "<|user|>"
  - "<|system|>"
  - "<tool_response>"
  - "</tool_response>"
  - "/nothink"                              # codespell:ignore nothink
  - "<|begin_of_box|>"
  - "<|end_of_box|>"

vocab_size: 154880                          # GLM-5.3-NVFP4 config.json
degenerate:                                 # 2026-10-27, from the GLM-5.3-NVFP4 tokenizer; read on token ids
  - {id_range: [154821, 154826], run: 20}   # [MASK] [gMASK] [sMASK] <sop> <eop> <|system|>
  - {id: 154828, run: 20}                   # <|assistant|>
  - {id_range: [154830, 154837], run: 20}   # media and transcription markers
  - {id_range: [154856, 154879], run: 20}   # untrained rows

reasoning:
  channel: think tags
  known: "GLM closes </think> twice, and left a leading </think> residue on 32-35% of turns
    before 951f41ed54."

context:
  model_max: 1048576
  serving: "As the GLM-5.3 fleet serves it (references/smoke.md 3c): max_seq_len 1048576, chunked
    prefill, max_num_tokens 8192, block reuse on."
