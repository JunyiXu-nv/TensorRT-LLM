# The fleet Kernel Factory is pointed at: several disaggregated deployments
# behind one gateway, each configured on its own.
#
#   ./fleetctl up          bring every instance up
#   ./fleetctl status      what is running against what is configured
#   ./fleetctl roll a      replace one instance without dropping traffic
#   ./fleetctl down a      stop one
#
# Instances are independent on purpose. They differ in prefill/decode ratio,
# and the right ratio is not known yet -- agent turns replay their whole
# history, so this workload is prefill-heavy in a way ordinary chat is not, and
# the only way to find the ratio is to run more than one and compare.
#
# Every instance registers into the SAME fleet directory. serve.sh names each
# registration after its job id, so they do not collide, and the gateway
# discovers the directory rather than any one file -- which is what makes them
# one pool instead of four unrelated servers.

defaults:
  # cluster_name and model.name key the fleet directory. Identical across
  # instances BY DESIGN: serli's file warns that sharing them makes two
  # deployments register as backends of each other, which is exactly what is
  # wanted here and the opposite of what it wanted there.
  cluster_name: kffleet
  repo_dir: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TensorRT-LLM

  model:
    name: glm5.2
    # Not the path in serli's file. That one resolves through
    # /lustre/fsw/portfolios/coreai/users/serli -> coreai_mlperf_inference,
    # a PPP this account cannot read; every read there fails EACCES. This is
    # the copy under coreai_kf_dev, same checkpoint, readable.
    path: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/serli/models/GLM-5.2-NVFP4
    tool_parser: glm47

  slurm:
    account: coreai_kf_dev
    partition: batch_long
    # normal, not interactive. interactive has priority 700 but caps at
    # MaxTRESPU node=4 with DenyOnLimit -- one 8-node instance would be
    # rejected outright rather than queued. Measured queue waits on this
    # account are a 1.7 min median at 4 nodes, so the priority is worth less
    # than the headroom.
    qos: normal
    time: "24:00:00"
    gpus_per_node: 4
    extra_args: []

  container:
    # The image `jenkins/current_image_tags.properties` pins for this source
    # tree, imported under our own sqsh/. Keep these two in step: the compiled
    # artifacts in tensorrt_llm/libs are built inside this image, so pairing a
    # different one with them is an untested combination.
    image: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/sqsh/sw-tensorrt-llm-docker-local+tensorrt-llm+pytorch-26.05-py3-sbsa-ubuntu24.04-skip-tritondevel-202608271702-17084.sqsh
    mounts:
      - /scratch/fsw:/scratch/fsw
      # /lustre/fsw, where trace.request_root points, is mounted by default on
      # this cluster and so is deliberately absent here.

  server:
    install_repo: true
    numactl: "0,1"
    capture: true
    extra_args: []
    env:
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_ANTHROPIC_LCP_TRACKING: "1"
      ENROOT_ALLOW_DEV: "yes"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      MIMALLOC_PURGE_DELAY: "0"
      TLLM_PROFILE_LOG_RANKS: all
    disagg:
      start_timeout: 7200

  gateway:
    # How a backend announces itself. Unset means the file drop: serve.sh
    # writes into <trace.root>/_fleet/<cluster>_<model> and the gateway reads
    # that directory, which works precisely while the two share a filesystem.
    #
    # They do not when the gateway runs outside the cluster -- and there is a
    # good reason to put it there. Everything the gateway does is in service of
    # one URL that does not move, and inside the scheduler that costs the whole
    # chain in gateway.sbatch: a successor submitted at every start, pinned to
    # one node, with a gap at each handover and a thrash guard that will refuse
    # to continue. A host with no wall clock needs none of it.
    #
    # Setting register_url makes each job POST to /_gateway/backend instead.
    # The gateway probes the address before accepting and writes the same
    # record itself, so discovery, routing and the analysis all stay as they
    # are. It repeats every sixty seconds rather than announcing once, because
    # a gateway that restarts comes up with an empty directory and nothing else
    # would put this backend back in it.
    #
    # Commented out until jhb -> ipp2 HTTP is confirmed to work: the traffic
    # this needs is outbound from a compute node, which is exactly what fails
    # for Kernel Factory from there. The reverse direction is known good.
    #
    # register_url: http://ipp2-1730.ipp2a1.colossus.nvidia.com:8333
    # api_key: junyix

  trace:
    # Everything this deployment writes for itself: run directories, engine
    # logs, perf metrics, the sbatch logs, and the fleet registration directory
    # the gateway watches (serve.sh derives all four from this one path). It is
    # `var/` inside the checkout deliberately -- these files are this
    # deployment's business and nobody else's, and keeping them beside the
    # scripts that produce them means one path to set rather than five.
    # gitignored, because the engine logs alone reach ~150 GB per instance over
    # the seven days a job may live.
    root: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TensorRT-LLM/examples/serve/large_scale_serving/var

    # The exception, and the only output another team consumes: the per-request
    # and per-response traces that tensorrt_llm/serve/request_trace.py writes.
    # Unset keeps them under the attempt directory like everything else.
    #
    # TRTLLMxKF is shared, so this deployment keeps to a directory of its own
    # under it. serve.sh still exports TRTLLM_REQUEST_TRACE_DIR as
    # <attempt>/request_trace and symlinks that to
    # <request_root>/<run>/<attempt>, so the bytes land here while every reader
    # -- analysis/, the rollup store, the dashboard collectors -- goes on
    # finding them where it always has.
    request_root: /lustre/fsw/portfolios/coreai/users/jingquanw/TRTLLMxKF/trace_data_gen

# Ports are the one thing that must differ. A disaggregated deployment binds
# the proxy port plus one per worker frontend, so they are spaced widely enough
# that two instances on one node cannot overlap.
instances:
  - name: a
    port: 8400
    topology: server_configs/glm5.2_disagg_6p1d.yaml
    ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
    gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  - name: b
    port: 8420
    topology: server_configs/glm5.2_disagg_6p1d.yaml
    ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
    gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  - name: c
    port: 8440
    topology: server_configs/glm5.2_disagg_6p1d.yaml
    ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
    gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  - name: d
    port: 8460
    topology: server_configs/glm5.2_disagg_6p1d.yaml
    ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
    gen: server_configs/glm5.2_gen_dep8_mtp.yaml
