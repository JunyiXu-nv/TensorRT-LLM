# fleet_serli_4p1d_dep16_nvfp4_sb3b7cvq.yaml (2026-10-12, serli): fleet_serli_4p1d_dep16_nvfp4_sb3b7cv.yaml (job 956115) on QOS short (2 h cap, higher priority), port 8750; submitted in parallel, whichever starts first is kept.
# Same as fleet_serli_4p1d_dep16_nvfp4_mooncake_lb.yaml (job 928339: master on the proxy node + 4 x 512 GiB gen-node donors,
# 16 x 160 GiB ctx segments, MC_GID_INDEX=3, account coreai_kf_dev, mounts = serli tree + model :ro) except:
#   topology -> server_configs/glm5.3_disagg_4p1d_dep16.yaml
#   ctx      -> server_configs/glm5.3_ctx_dep4_mtp_nvfp4_mooncake_conv_f085.yaml
#   cluster_name serli4p1d16sb3b7cvq / instance p4d16sb3b7cvq / port 8750
#
defaults:
  # Distinct from kffleet / kftest so this can never register into either pool.
  cluster_name: serli4p1d16sb3b7cvq
  repo_dir: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/workspace/TensorRT-LLM-k3-simengl-3b7aa829

  model:
    name: glm5.3
    # JET artifact model/zai-org_glm-5.3/hf:hf-e0b07fd_orig, the only GLM-5.3 the
    # registry has materialised on oci-jhb (storage oci-jhb-slurm-1_lustre). FP8
    # block-scaled (e4m3, 128x128), 704 GB, 141 shards; same HF commit as the
    # jijain copy serli's 2026-09-04..07 agadisagg_glm5.3 runs used. Spelled
    # /scratch/fsw because that is the mount below; /lustre/fsw is a symlink.
    # (2026-10-10: the model.path above now IS the nvidia GLM-5.3-NVFP4 artifact hf-416bdc1,
    # synced to this cluster on 2026-09-22; the comment above describes the FP8 original.)
    path: /scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/nvidia_glm-5.3-nvfp4/hf/hf-416bdc1_orig
    tool_parser: glm47

  slurm:
    account: coreai_kf_dev
    partition: batch_long
    qos: short
    time: "02:00:00"
    gpus_per_node: 4
    # One NVL72 rack: fleetctl turns `auto` into the node count (3 here), which
    # under topology/block confines the allocation to a single block. Required
    # by the UCX_TLS list below, which names no IB transport.
    segment: auto
    extra_args: []

  container:
    # official-26.08-19152, copied from simengl's pareto05 run (sha256 566317131f05...);
    # /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/workspace/TensorRT-LLM-k3-simengl-adp-mooncake was built inside it (builds/k3-simengl-adp-mooncake).
    image: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/containers/official-26.08-19152.sqsh
    # Only serli's tree (repo, builds, caches, pylibs, var/) and the model, read-only.
    mounts:
      - /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli:/scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli
      - /scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/nvidia_glm-5.3-nvfp4/hf/hf-416bdc1_orig:/scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/nvidia_glm-5.3-nvfp4/hf/hf-416bdc1_orig:ro

  server:
    install_repo: true
    numactl: "0,1"
    capture: true
    extra_args: []
    env:
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_ANTHROPIC_LCP_TRACKING: "1"
      ENROOT_ALLOW_DEV: "yes"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      MIMALLOC_PURGE_DELAY: "0"
      TLLM_PROFILE_LOG_RANKS: all
      # Single-rack KV transfer over cuda_ipc/IMEX; pairs with segment: auto.
      UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
      TRTLLM_NIXL_NUM_THREADS: "1"
      # DSA indexer: fp8_mqa_logits materialises a [q_tile x kv] fp32 logits
      # tile per call; the default budget is 2^31 elements = 8 GiB. On the FP8
      # TP4 ctx worker only ~6 GiB is free once weights (194 GiB) + KV pool
      # (49.8 GiB) + workspaces are resident, so every request whose KV history
      # reaches ~262k tokens (5 % of the i00 T09 hour) OOMs the rank and takes
      # the worker down (seen on 2P1D attempts 1-3, 2026-09-19). 2^29 elements
      # = 2 GiB per tile; results are identical, only more kernel launches.
      TLLM_INDEXER_MQA_LOGITS_ELEM_BUDGET: "536870912"
      # serli's own JIT cache (junyix's is not writable by serli). First start
      # compiles (~30 min); later starts hit the cache.
      # Mooncake transfer engine on oci-jhb: routable RoCE GID on the rail VFs (zpatel,
      # agentx glm_5.2/gb300/mooncake README); auto-discovery picks a link-local GID and times out.
      MC_GID_INDEX: "3"
      FLASHINFER_WORKSPACE_BASE: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/flashinfer
    disagg:
      start_timeout: 7200
      # Proxy (+ its num_workers fleet processes) on the LAST allocation node = a
      # generation node; the launcher writes server_url from the resolved node.
      proxy_node: last
    # Shared Mooncake store pool for the ctx kv_connector (serve.sh server.mooncake). Capacity:
    # 16 ctx ranks x 160 GiB segments (ctx config) + 4 gen nodes x 512 GiB donors = 4,608 GiB,
    # vs 16 x 160 GiB = 2,560 GiB of private host tier in the control arm.
    mooncake:
      pythonpath: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/pylibs/mooncake-transfer-engine-cuda13-0.3.13
      model_key: glm53-nvfp4-hf416bdc1-adp-v2-tpb64-fp8kv-dsa-mtp3
      donor_segment_size: 512GiB
      protocol: rdma
      device_name: rdma_vf_rail0,rdma_vf_rail1,rdma_vf_rail2,rdma_vf_rail3
      metadata_server: P2PHANDSHAKE

  # No gateway. register_url unset -> file drop into <trace.root>/_fleet, read by nobody.
  gateway: {}

  trace:
    # var/ inside this checkout (gitignored). request traces stay under the attempt dir.
    root: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/workspace/TensorRT-LLM-k3-simengl-3b7aa829/examples/serve/large_scale_serving/var

# 8600: inside the 8200-8880 window that is clear of the node's own listeners,
# and clear of kffleet (8200-8460) and kftest (8800-8820).
instances:
  - name: p4d16sb3b7cvq
    port: 8750
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_mooncake_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
