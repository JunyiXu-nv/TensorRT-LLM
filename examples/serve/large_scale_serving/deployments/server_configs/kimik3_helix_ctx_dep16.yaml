#
# Kimi-K3-NVFP4 CONTEXT worker for the ctx16/gen2 Helix layout: one DEP16
# worker (TP16 + attention DP + EP16, four 4-GPU GB300 nodes) feeding two Helix
# CP16 generation workers (kimik3_helix_gen_cp16.yaml); the proxy config is
# kimik3_helix_disagg_1c2g.yaml.
#
# Source: the GB300 agentx e2e benchmark config
# ctx16_gen2_helix16_batch32_eplb0_mtp7_concurrency114_maxnt256 (2026-09-24),
# whose context side is 16 single-GPU DWDP servers. Two changes from it:
#   - DWDP (dwdp_size 16, a feature of the benchmark's own branch) becomes one
#     DEP16 worker, the context layout this branch serves K3 with;
#   - the KDA recurrent state is fp32 instead of bfloat16 (see
#     mamba_ssm_cache_dtype below).
# Everything else is as benchmarked. Unlike kimik3_ctx_dep16.yaml, this runs
# FP8 KV, KV cache manager V2 with per-conversation block reuse and the CUTEDSL
# MoE backend.
#
# Changed 2026-10-09: 8,192-token forwards (one MoE chunk) with up to 64
# requests per batch, KV-cache-aware attention-DP routing in place of
# conversation affinity, and an explicit KDA-state/MLA-KV pool split in place
# of the avg_seq_len-derived one.

context_parallel_size: 1
enable_attention_dp: true
pipeline_parallel_size: 1
tensor_parallel_size: 16
moe_expert_parallel_size: 16

trust_remote_code: true

attention_dp_config:
  # KV-cache-aware routing across the attention-DP ranks: a request goes to the
  # rank holding the longest matching prefix, with no load-balance term
  # (weight 0.0) and a per-rank cap of 64x the fair share, which in practice
  # only stops a runaway. The first tp_size requests after start are
  # round-robined so every rank caches the shared prefix before scoring would
  # pin all traffic to the first warm one. Conversation affinity stays off: it
  # takes precedence over cache-aware routing when both are set.
  enable_kv_cache_aware_routing: true
  kv_cache_routing_load_balance_weight: 0.0
  kv_cache_routing_cold_start_warmup: true
  kv_cache_routing_fair_share_multiplier: 64

moe_config:
  backend: CUTEDSL
  max_num_tokens: 8192
  use_low_precision_moe_combine: true

# PYTHON + NIXL is the only transceiver route that moves the KDA recurrent
# state; every key here must match the generation worker.
cache_transceiver_config:
  backend: NIXL
  transceiver_runtime: PYTHON
  kv_transfer_timeout_ms: 600000
  kv_cache_bounce_size_mb: 0

cuda_graph_config: null
disable_overlap_scheduler: true
enable_chunked_prefill: true
# One MoE chunk per forward (moe_config.max_num_tokens).
max_num_tokens: 8192

kv_cache_config:
  dtype: fp8
  tokens_per_block: 64
  use_kv_cache_manager_v2: true
  enable_block_reuse: true
  block_reuse_config:
    policy: per_conversation
    max_num_turns: 5
  free_gpu_memory_fraction: 0.7
  # 160 GiB of host memory per rank for offloaded reusable blocks.
  host_cache_size: 171798691840
  # fp32, not the benchmark's bfloat16: this branch's fused KDA MTP verify on
  # the generation worker requires an fp32 recurrent-state pool, and the state
  # is transferred to it as raw bytes, so both workers must hold the same dtype.
  mamba_ssm_cache_dtype: float32
  mamba_state_config:
    additional_snapshot_offsets_from_end: [0]
  # Hot-tier byte split per KVCacheManagerV2 layer group, in layer-group ID
  # order: group 0 is the KDA recurrent state (ssm_state/conv_state), group 1
  # the MLA KV (role=key); the startup log prints this role-to-group mapping.
  # Exactly one entry per group (a 4-entry list stops every rank at startup),
  # and avg_seq_len no longer takes effect once this is set, so it is gone.
  pool_ratio: [0.45, 0.55]

max_batch_size: 64
max_beam_width: 1
max_seq_len: 996672

num_serve_frontends: 8
return_perf_metrics: true
print_iter_log: true
stream_interval: 10
