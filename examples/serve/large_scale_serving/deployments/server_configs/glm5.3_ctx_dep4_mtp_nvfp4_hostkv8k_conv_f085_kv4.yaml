# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085_kv4.yaml (2026-10-10, serli): copy of
# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml with TWO changes for the NVFP4-KV-cache experiment
# (sweep nvfp4kvi02, run from the K3-based checkout TensorRT-LLM-k3 = junyixu/dev-junyix-feat-kimi-k3-serving
# @ 9be4865dee, upstream main 2026-10-06 incl. PR #17681 "Add NVFP4 KV cache support for DSA"):
#   kv_cache_config.dtype                   fp8  -> nvfp4   (MLA latent 576 B -> 288 + 36 scale + 64-dim RoPE residual
#                                                            32 + 4 = 360 B/token/layer; TRTLLM_NVFP4_MLA_RESIDUAL_QUANTIZATION=1 default)
#   kv_cache_config.use_kv_cache_manager_v2        -> true   (NVFP4 DSA needs the V2 manager; V2 keeps host_cache_size)
# Transfer: cache_transceiver_config NIXL + transceiver_runtime PYTHON (unchanged) — the Python V2 page table carries every
# buffer role of a layer group, incl. the KEY_BLOCK_SCALE pool the C++ formatters skip. Unverified in disagg upstream
# (their GLM-5.2 NVFP4 disagg test runs FP8 KV): first run is a correctness smoke as much as a perf point.
# The NVFP4 DSA context gather reads the whole attended prefix -> the estimator reserves a workspace and installs a
# context admission cap by summed attended KV (PR #17681); free_gpu_memory_fraction stays 0.85, watch the cap in the log.
# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml (2026-10-10, serli): copy of
# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_fs64_f085.yaml with the attention-DP router switched
# from KV-cache-aware prefix routing to explicit conversation affinity (A/B, sweep nvfp4i02cv):
#   attention_dp_config.enable_kv_cache_aware_routing        true  -> false
#   attention_dp_config.kv_cache_routing_conversation_affinity       -> true   (ADDED)
#   attention_dp_config.kv_cache_routing_max_sessions                -> 65536  (ADDED, default)
#   attention_dp_config.kv_cache_routing_new_conv_placement          -> round_robin (ADDED, default)
# ConversationAwareADPRouter (adp_router.py:899): first turn of a conversation is round-robined
# across the 4 ranks, every later turn with the same conversation_params.conversation_id is
# pinned to that rank; the map survives KV eviction (prefix-match affinity does not, which is
# how the "sink rank" forms at the ctx KV wall). The disagg proxy fills conversation_id from
# the body's prompt_cache_key / client_metadata.session_id (serve/conversation_id.py); 99.9 %
# of the replayed requests carry both. fair_share_multiplier 64 is still passed to this router
# (request-count cap); load_balance_weight / cold_start_warmup are ignored by it.
# Same as agentx/glm_5.2/gb300 pareto05 (itabrizian/disaggregated-serving-benchmarking).
# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_fs64_f085.yaml (2026-10-10, serli): copy of
# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_fs64.yaml with ONE change:
#   kv_cache_config.free_gpu_memory_fraction  0.75 -> 0.85
# Why: on the NVFP4 checkpoint the ctx rank's non-KV peak is 155 GiB (FP8: 209), so
# the 25 % headroom that 0.75 leaves grew from 16.9 GiB to 30.4 GiB although the
# transients it protects (MoE workspace, MTP draft activations, the DSA indexer tile
# capped at 2 GiB by TLLM_INDEXER_MQA_LOGITS_ELEM_BUDGET=2^29) are absolute, not
# proportional. 0.85 keeps ~18 GiB of headroom (the FP8 level) and lifts the device
# KV quota from 91.1 to ~103 GiB per rank. 0.9 was not taken: the comment at the
# fraction below (MTP draft head not covered by profiling) still applies.
# Experiment: sweep nvfp4i02c85, N=640, vs nvfp4i02 (0.75) job 918187.
# glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_fs64.yaml (2026-10-10): copy of
# glm5.3_ctx_dep4_mtp_fp8_hostkv8k_fs64.yaml for the GLM-5.3 NVFP4 checkpoint
# (JET model/nvidia_glm-5.3-nvfp4/hf:hf-416bdc1_orig, 464 GB / 50 shards, modelopt
# MIXED_PRECISION: routed experts NVFP4 g16 in layers 3-77, dense MLP of layers 0-2
# FP8 per-tensor, attention / indexer / shared experts / MTP layer 78 BF16, KV FP8).
# ONE change vs the FP8 file:
#   moe_config.backend  TRTLLM -> CUTEDSL
#       fused_moe_cute_dsl.py can_implement (l.419-425) accepts QuantAlgo.NVFP4 on
#       SM100/SM103; it was TRTLLM in the FP8 file only because CuteDSL rejects
#       FP8_BLOCK_SCALES (l.427-435). Same backend as the GLM-5.2 NVFP4 production
#       ctx config glm5.2_ctx_dep4_mtp.yaml. With the backend unset, model_config.py
#       resolve_moe_backend (l.468-507) would return CUTLASS for this architecture /
#       quant algo, i.e. CutlassFusedMoE, not CuteDSL. The unquantized MTP layer 78
#       falls back per layer to CutlassFusedMoE (moe_resolution.py FALLBACK_IMPL
#       l.111, _candidates_for l.304-315) exactly as on GLM-5.2 NVFP4.
# NOT changed, deliberately: kv_cache_config.dtype fp8 (hf_quant_config.json
# kv_cache_quant_algo FP8), free_gpu_memory_fraction 0.75 (the NVFP4 weights are
# ~110 GB/GPU lighter at TP4, so the same fraction yields a far larger device KV
# pool), host_cache_size 160 GiB, max_num_tokens 8192, max_batch_size 64, fs64
# routing, MTP 3, TLLM_INDEXER_MQA_LOGITS_ELEM_BUDGET in the fleet env (the indexer
# tile budget is independent of the weight format; indexer weights are BF16 in
# both checkpoints). use_low_precision_moe_combine is left unset on the ctx worker
# as in the GLM-5.2 ctx config (it only shrinks the attention-DP combine payload;
# the reference recipes set it on decode workers only).
#
# (original header of glm5.3_ctx_dep4_mtp_fp8_hostkv8k_fs64.yaml follows)
# glm5.3_ctx_dep4_mtp_fp8_hostkv8k_fs64.yaml (2026-10-08): copy of
# glm5.3_ctx_dep4_mtp_fp8_hostkv8k.yaml with ONE change, requested by serli for the
# October independent-replay sweep:
#   attention_dp_config.kv_cache_routing_fair_share_multiplier: 64   (default 2.0)
# The multiplier x ceil(fair share) is the loose per-rank active-request cap of the
# KV-aware router; at 2.0 the router refuses to stack more than ~2x the fair share on
# the rank that holds the prefix, which on the GLM-5.2 i00 A/B (2026-09-29, jobs
# 689718 vs 689750) queued ctx at the bsz-16 cap (TTFB p90 10.7 s vs 1.9 s with 64).
# Everything else -- routing weight 0.0, cold-start warm-up, 8k chunks, 160 GiB host
# tier, bsz 64 -- is identical to the original; see its comments.
#
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
# GEN-PERF EXPERIMENT (serli, 2026-09-21, 4P1D DEP16/DEP32 sweep): copy of
# glm5.3_ctx_dep4_mtp_fp8_hostkv.yaml with ONE change: max_num_tokens 16384 -> 8192
# (the 16k chunk costs 2x an 8k chunk for the same per-token price and raises the
# idle pad to 16382 tokens, see the 2026-09-20 host-KV run). host_cache_size stays
# 160 GiB (171798691840), max_batch_size 64, no max_tokens_in_buffer.
# ---------------------------------------------------------------------------
# HOST-KV EXPERIMENT (serli, 2026-09-20): glm5.3_ctx_dep4_mtp_fp8.yaml with four
# changes, probing whether 4 co-located ctx ranks can pin 4 x 180 GiB of host KV
# tier on one ~942 GB node and what a larger host tier + bigger chunks buy:
#   kv_cache_config.host_cache_size 42949672960 (40 GiB) -> 193273528320 (180 GiB); 171798691840 (160 GiB) from attempt-002 after the 180 GiB tier drove MemAvailable to 0 at 160 sessions
#   cache_transceiver_config.max_tokens_in_buffer: 8192 REMOVED (defaults to max_seq_len)
#   max_batch_size 16 -> 64;  max_num_tokens 8192 -> 16384.  Everything else verbatim.
# ---------------------------------------------------------------------------
# GLM-5.3-FP8 CONTEXT worker: glm5.2_ctx_dep4_mtp.yaml applied to the FP8
# block-scaled checkpoint (JET model/zai-org_glm-5.3/hf:hf-e0b07fd_orig, 704 GB,
# 176 GB of weights per GPU at TP4 on a 284 GB GB300). GLM-5.2 and GLM-5.3 share
# an architecture config byte for byte, so only the quantization-dependent key
# changes:
#
#   moe_config.backend  CUTEDSL -> TRTLLM.  fused_moe_cute_dsl.py rejects
#       FP8_BLOCK_SCALES outright on SM100/103 and moe_resolution then raises
#       "no MoE implementation can serve this layer" at construction time.
#       TRTLLM is what model_config.py picks for FP8_BLOCK_SCALES; DEEPGEMM is
#       the other eligible backend. Same choice as serli's 2026-09-04..07
#       agadisagg_glm5.3 runs and junyix's datagen-glm53.
#
# Everything below this header is the GLM-5.2 file verbatim; see it for the
# reasoning behind each value.
# ---------------------------------------------------------------------------
allreduce_strategy: NCCL
context_parallel_size: 1

# LOCAL, not the reference. The reference sets enable_kv_cache_aware_routing
# false and routes on kv_cache_routing_conversation_affinity instead, but that
# affinity is driven by Dynamo -- the recipe pairs it with DYN_ENGINE_CONV_AFFINITY
# and DYN_ROUTER_SESSION_AFFINITY_TTL_SECS, and it is Dynamo's router that
# assigns the session id. This deployment has no Dynamo: trtllm-serve's own
# disaggregated proxy is the router, so turning conversation affinity on would
# leave the prefill side with neither affinity nor prefix routing.
enable_attention_dp: true
attention_dp_config:
  # Route by prefix-match length alone. _score_rank is
  #   (req_tokens - match_len) + load_balance_weight * normalized_load
  # so weight 0 drops the load term entirely and the rank holding the longest
  # matching prefix wins outright. Ties -- every rank at match_len 0 on a cold
  # tree, for instance -- still fall to the least-loaded rank, which is a
  # hard-coded tie-break in the scoring loop, not a knob.
  enable_kv_cache_aware_routing: false
  kv_cache_routing_conversation_affinity: true
  kv_cache_routing_max_sessions: 65536
  kv_cache_routing_new_conv_placement: round_robin
  kv_cache_routing_load_balance_weight: 0.0
  # Kept on. The first dp_size requests are round-robined by ascending rank
  # index without scoring at all, so every rank caches the shared system prompt
  # before scoring starts. Without it the first request seeds one rank, that
  # rank is then the only one with a nonzero match_len, and with the load term
  # gone nothing at all pulls traffic back to the others.
  kv_cache_routing_cold_start_warmup: true
  # Loose per-rank active-request cap = multiplier x ceil(fair share). 2.0 (default)
  # throttles the prefix-holding rank; 64 effectively lifts the cap so max_batch_size
  # (64) and the KV pool are the only limits. Same value as glm5.2_ctx_dep4_mtp_bsz64_fs64.
  kv_cache_routing_fair_share_multiplier: 64
  # match_rate_threshold stays at its 0.1 default, which is also what the
  # reference pins through TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD=0.10 -- so that
  # env var is not carried into the deployment YAML, it would set what is
  # already set.

# NIXL because the Python transceiver supports only NIXL and DEFAULT; PYTHON
# because "auto" falls back to the C++ transceiver, whose binding takes the V1
# BaseKVCacheManager. Both match the reference.
cache_transceiver_config:
  backend: NIXL
  transceiver_runtime: PYTHON
  # 10 minutes, same as the reference. Must be >= the 60s default, which cancels
  # a request whose KV has not finished moving, and these contexts run to ~1M
  # tokens. The reference also exports TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC=600;
  # the deployment YAML carries that.
  kv_transfer_timeout_ms: 600000
  # LOCAL, not the reference's 1048576. This sizes a real buffer, and 8192 is
  # what the Flash disaggregated bring-up validated end to end on this container.
  # The reference pairs 1048576 with kv_cache_bounce_size_mb: 5120, i.e. it caps
  # the staging buffer separately; adopting the token count without the bounce
  # cap would size the buffer off max_seq_len instead of off a chunk. Raise both
  # together or neither. Must match the generation worker either way.

# No cuda_graph_config: graphs need every rank generation-only in the same
# step, which never happens on a context worker. The reference sets
# cuda_graph_config: null here for the same reason.
disable_overlap_scheduler: true
enable_autotuner: false
enable_chunked_prefill: true

kv_cache_config:
  avg_seq_len: 262144
  dtype: nvfp4
  use_kv_cache_manager_v2: true
  enable_block_reuse: true
  # REFERENCE, down from the local 0.85. Two reasons to take the more
  # conservative number here rather than defend the old one: MTP adds an
  # unquantized draft head plus draft-token activations that the 0.85 profiling
  # never saw, and _cal_max_memory splits what is left AFTER the profiled peak,
  # so a KV pool sized before the draft head grows cannot be given back.
  free_gpu_memory_fraction: 0.85
  # LOCAL 40 GiB, not the reference's 128 GiB. Host DRAM is not scarce -- 920 GiB
  # per node against 4 ranks -- so this is headroom to spend deliberately, not a
  # constraint; it is left where the running deployment has it so that a slow
  # prefill can be attributed to MTP or CUTEDSL rather than to a changed cache.
  host_cache_size: 171798691840
  tokens_per_block: 64

# LOCAL 16, not the reference's 256, and this one is not a preference.
# 128 was tried on this deployment and killed a rank: the MoE kernel asked for
# 3.93 GiB with 709 MiB free (job 525279, 22:08). The reference reaches 256 with
# six prefill workers absorbing a benchmark's arrival pattern; a single Claude
# Code prompt is tens of thousands of tokens and admits far more work per step
# than startup profiling measured. The headroom is not recoverable by lowering
# free_gpu_memory_fraction either -- see the note there. Bounding the batch is
# what keeps the step within what profiling saw.
#
# If this is raised, raise it with MTP already proven, one step at a time, and
# watch for the MoE allocation failure rather than for a latency change.
max_batch_size: 64
max_beam_width: 1
max_input_len: 1048575
# 8192, matching the reference and the running deployment.
max_num_tokens: 8192
max_seq_len: 1048576

moe_config:
  # REFERENCE, changed from the local TRTLLM. glm5.2_ctx_tep4.yaml called CUTEDSL
  # "an experiment to make deliberately, with the fallback log checked" -- it was
  # held back only because it was unproven on this model, after CUTEDSL had
  # silently fallen back per layer on DeepSeek-V4-Pro and cost 1.4-2.2s a request.
  # The reference is that proof: same checkpoint, same nvfp4, same node type,
  # CUTEDSL on both workers, measured to concurrency 227.
  #
  # It is still worth checking once on first bring-up, because the failure mode
  # is quiet: grep the worker log for a per-layer fallback line before trusting
  # a latency number. Reverting is this one line back to TRTLLM.
  backend: CUTEDSL  # NVFP4 checkpoint: see header (FP8 file had TRTLLM)
moe_expert_parallel_size: 4

# LOCAL, absent from the reference, which runs its prefill fleet behind Dynamo
# and never terminates HTTP in trtllm-serve itself. This does NOT add GPUs or a
# second engine: it runs 8 HTTP frontend processes against the ONE executor that
# already owns these 4 ranks. Frontend 0 is the process launched below by srun --
# it holds the engine and spawns the other 7, which re-exec the same trtllm-serve
# command line, attach to the running executor over IPC, and share --port via
# SO_REUSEPORT (the kernel spreads incoming connections by 4-tuple hash).
#
# The reason is this worker's request shape, not its GPU work: a single Claude
# Code prompt is tens of thousands of tokens and max_input_len is ~1M, so the
# frontend's JSON parse and tokenizer call are large, CPU-bound, and hold the GIL
# against every other in-flight request on the same event loop. Splitting the
# HTTP side across processes is the only way to overlap them; max_batch_size: 16
# bounds what actually reaches the GPU either way.
#
# Requirements, all satisfied by serve.sh's launch line: the default (classic
# IPC) executor path -- setting orchestrator_type would make this fail at
# startup -- and a fixed --port, since port 0 / --report_addr is rejected when
# this is > 1 (the attached frontends would each bind their own random port).
# It survives trtllm-llmapi-launch because each child is spawned with the MPI and
# SLURM identity vars stripped and TLLM_DISABLE_MPI=1, so it never tries to
# rejoin the launcher's job. Ceiling is 64 (a 6-bit frontend id is packed into
# the high bits of client_id to keep request ids distinct per frontend).
num_serve_frontends: 8

# Per-request timing and KV block counts, written straight to JSONL by the
# serving process (PerfMetricsJsonlWriter) and echoed on each response so the
# disaggregated proxy can file the joined ctx+gen record. serve.sh appends
# perf_metrics_output_dir per attempt, since only it knows the path.
return_perf_metrics: true
pipeline_parallel_size: 1
print_iter_log: true
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_chunking_policy: EQUAL_PROGRESS

# REFERENCE. glm5.2_ctx_tep4.yaml deliberately omitted this block, reasoning from
# the DeepSeek-V4-Pro recipes that every batch from 07-24 onward declares sparse
# attention on decode only. That generalisation does not hold for GLM-5.2: the
# reference recipe sets it on prefill AND decode, on this exact checkpoint.
#
# algorithm is the discriminator and is not optional -- sparse_attention_config
# is a tagged union keyed on it, so a block without it fails TorchLlmArgs
# validation outright and the worker dies before loading a weight (job 623663).
# dsa is the tag this model resolves to: model_config.py rebuilds the field as
# DeepSeekSparseAttentionConfig for GlmMoeDsaForCausalLM.
#
# index_topk is deliberately absent, matching the reference, so it falls back to
# the checkpoint. The generation worker pins it to 2048; the two do not have to
# agree, since only the tag and the KV layout cross the wire.
sparse_attention_config:
  algorithm: dsa
  enable_heuristic_topk: true

# REFERENCE. MTP is new to this deployment. GLM-5.2 ships num_nextn_predict_layers: 1,
# and MTPDecodingConfig.use_mtp_vanilla defaults false, so a single-layer
# checkpoint takes the EAGLE-style one-model path and max_draft_len may exceed
# the layer count -- which is how the reference runs 3 off one nextn layer.
# GlmMoeDsaForCausalLM registers in modeling_deepseekv3.py, so this is the
# DeepSeek MTP implementation, not a GLM-specific one.
#
# Must match the generation worker exactly. It is also the single largest
# unknown in this config: MTP across a disaggregated boundary is what the first
# bring-up is testing. The reference additionally exports
# TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=1.99, which pins the acceptance
# rate to a constant instead of measuring it -- that is a benchmark instrument,
# it makes the numbers comparable across recipes, and it is deliberately NOT
# carried into a serving deployment, where it would silently fabricate the
# speedup it is meant to report.
speculative_config:
  decoding_type: MTP
  max_draft_len: 3

tensor_parallel_size: 4
trust_remote_code: true
