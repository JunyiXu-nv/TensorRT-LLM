#
# GLM-5.3 NVFP4 on nsc-lhr-slurm-1 (GB300 NVL72, aarch64), on the K3 base.
# Served behind the lhr gateway as its own pool (glm5.3).
#
# Layout and engine configs are serli's best measured GLM-5.3 setting with
# FP8 KV (fleet_serli_4p1d_dep16_nvfp4_conv_f085_cutedsa_k3_indep.yaml, KF i02
# closed-loop session replay on 8 GB200 nodes: 0.920 req/s/GPU at 640
# sessions). Each instance has 8 nodes:
#   - four DEP4 context workers, one node each, with attention-DP
#     conversation-affinity routing, free fraction 0.85 and a 160 GiB host KV
#     tier per rank;
#   - one DEP16 generation worker on four nodes, with the CuTe DSL DSA kernels
#     (paged MQA logits and top-k) and free fraction 0.95;
#   - MoE backend CUTEDSL on both sides, MTP 3.
# The NVFP4 checkpoint needs the K3 base, so repo_dir is the lhr K3 serving
# checkout, which already holds that branch with its binaries. The image is the
# one that checkout was built in.
#
# Compared with serli's jhb file:
#   - lhr GPU nodes have no eth0. TCP goes over bond0, and KV between racks
#     moves over the four InfiniBand HCAs, so only each worker has to fit in
#     one rack (segment 4, see below), not the whole instance.
#   - The JIT caches (FlashInfer, Triton, HF modules) live on node-local disk.
#   - The racks with dead KV paths are excluded (see below and
#     fleet_kimik3_lhr.yaml).
#   - cluster_name is kflhr, so the fleet directory is _fleet/kflhr_glm5.3.

defaults:
  cluster_name: kflhr
  repo_dir: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TensorRT-LLM-k3-serving
  model:
    name: glm5.3
    # nvidia/GLM-5.3-NVFP4 at 416bdc1. It is modelopt MIXED_PRECISION: NVFP4 g16
    # routed experts, FP8 dense MLP layers 0-2, BF16 attention/MTP and FP8 KV,
    # 464 GB in 50 shards. This is our copy of serli's lhr download.
    path: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/models/nvidia_glm-5.3-nvfp4/hf-416bdc1_orig
    tool_parser: glm47
  slurm:
    account: coreai_kf_dev
    partition: batch_long
    qos: normal
    time: "7-00:00:00"
    gpus_per_node: 4
    # The generation worker's MoE all-to-all has to stay inside one NVLink
    # domain, so its four nodes must sit in one NVL72 rack. The context workers
    # are one node each. Two segments of four give that, and the instance
    # itself may span racks. Not 8 (whole instance in one rack): lhr nodes are
    # lost to slurm-operator pod terminations several times an hour, and a
    # requeue waiting for a whole free rack can start hours later. serve.sh
    # orders the nodes by topology block, then name, and gives the first four
    # to the context workers and the last four to the generation worker.
    segment: 4
    extra_args:
      # Occupied Idle Job Reaper exemption: a start spends 20-50 min with idle
      # SMs (checkout install, weight load, profiling).
      - '--comment={"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"inference_server","description":"TRT-LLM disaggregated inference server for agent data generation: each start installs the checkout and loads 0.5-1.4 TB of weights (20-50 min with idle SMs) and the server must stay up between request bursts"}}'
      # With a K3 context worker on rack d028 or d015, every KV transfer of
      # the instance failed although ucx_perftest between the same nodes
      # passes. d017 joined them on 2026-10-10: a context worker there could
      # not reach a generation worker on rack d051 on any rail (i03 job
      # 136649), and Slurm handed the same freed nodes straight to the next
      # pending instance, so the pair kept coming back. Excluding one rack of
      # the pair is enough. d033 (dead KV path to d047 and failed IMEX health
      # checks), d012 (dead paths to d032 and d054) and d005 (to d034) follow
      # the same rule, and d054 (dead paths from d012, d043 and some d039 trays)
      # and d043 (dead paths from it to d048, d054 and d055) are excluded whole;
      # d043 has no T16-T18. Trays d029-T07/T08 reach no other rack's generation
      # worker (d013, d056) while the rest of d029 does, so only those two are
      # excluded. d056 has dead paths with d011, d042 and d049 although d007,
      # d008, d013 and d053 reach it, and is excluded whole. They used to be
      # added only to pending jobs, which a QoS short
      # resubmission outruns. d028 has no T17, d017 no T17 or T18 and d012 no
      # T15 or T16, and sbatch rejects an --exclude that names a node Slurm
      # does not have.
      - --exclude=nvl72d028-T[01-16,18],nvl72d015-T[01-18],nvl72d017-T[01-16],nvl72d033-T[01-18],nvl72d012-T[01-14,17-18],nvl72d005-T[01-18],nvl72d054-T[01-18],nvl72d043-T[01-15],nvl72d029-T[07-08],nvl72d056-T[01-18]

  container:
    # The image the K3 serving checkout's binaries were built in (pytorch 26.08,
    # torch 2.14, flashinfer 0.6.18), as in fleet_kimik3_lhr.yaml.
    image: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/sqsh/trtllm-devel-pytorch-26.08-sbsa-lhrbuild-811c01b3ed.sqsh
    mounts:
      - /scratch/fsw:/scratch/fsw

  server:
    install_repo: true
    numactl: "0,1"
    capture: true
    raw_output: true
    post_install:
      # NIXL's UCX plugin with the v1.5.0 endpoint-failure fix (drop once the
      # image ships NIXL >= 1.5.0).
      - >-
        echo "478e574dacb967e082626d00e0a7d06519c60138d5a1991066c0161b3f98d5de  /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/nixl_fix/out/nixl140fix-26.08/libplugin_UCX.so" | sha256sum -c -
        && cp -f /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/nixl_fix/out/nixl140fix-26.08/libplugin_UCX.so /opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/plugins/libplugin_UCX.so
      # Seed this node's FlashInfer cache from the shared copy (see
      # FLASHINFER_WORKSPACE_BASE below); modules already built there are
      # reused, missing ones compile locally. flashinfer 0.6.18 needs its own
      # cache: a cold first start compiles for about 30 min.
      - >-
        mkdir -p /tmp/flashinfer-glm53-2608
        && { [ -d /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/flashinfer-glm53-2608/.cache ]
        && cp -a /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/flashinfer-glm53-2608/. /tmp/flashinfer-glm53-2608/ || true; }
    extra_args: []
    env:
      TLLM_LOG_LEVEL: INFO
      # The cyclic GC must stay on in every process that parses requests: see ENV_DEFAULTS in serve.sh.
      TRTLLM_SERVER_DISABLE_GC: "0"
      TRTLLM_DISAGG_SERVER_DISABLE_GC: "0"
      TRTLLM_WORKER_DISABLE_GC: "1"
      # 8 attached frontends on a context worker re-import the package after
      # the weight load; 300 s is not always enough.
      TLLM_FRONTEND_READY_TIMEOUT: "1800"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_ANTHROPIC_LCP_TRACKING: "1"
      ENROOT_ALLOW_DEV: "yes"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      MIMALLOC_PURGE_DELAY: "0"
      TLLM_PROFILE_LOG_RANKS: all
      TRTLLM_RESPONSES_API_DISABLE_STORE: "1"
      # Element budget of the DSA indexer's MQA-logits pass, as in serli's runs.
      TLLM_INDEXER_MQA_LOGITS_ELEM_BUDGET: "536870912"
      # Traffic between nodes may use the four InfiniBand HCAs (XDR, one per
      # GPU; GPU memory is registered through dma-buf): KV crossing racks
      # moves GPU to GPU over RDMA, KV inside a rack over NVLink (cuda_ipc).
      # bond0 stays listed for TCP.
      UCX_TLS: "rc,cuda_ipc,cuda_copy,sm,self,tcp"
      UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,bond0"
      TRTLLM_NIXL_NUM_THREADS: "1"
      # JIT caches on node-local storage, not on /scratch (VAST NFS): FlashInfer
      # takes a blocking file lock even on a cache hit, and a waiter on this
      # NFS can block indefinitely after the holder has released it. The
      # container is named per job, so /tmp persists from post_install to the
      # workers.
      FLASHINFER_WORKSPACE_BASE: /tmp/flashinfer-glm53-2608
      TRITON_CACHE_DIR: /tmp/triton-cache
      XDG_CACHE_HOME: /tmp/xdg-cache
    disagg:
      start_timeout: 7200
      # The proxy runs on the generation worker's last node instead of beside
      # a one-node context worker, as in serli's measurements.
      proxy_node: last

  gateway:

  # Run directories and fleet registrations go where the lhr gateway reads
  # them (its GW_VAR, under the first lhr K3 checkout); request traces go to
  # the same tree as on jhb.
  trace:
    root: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TensorRT-LLM-k3/examples/serve/large_scale_serving/var
    request_root: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TRTLLMxKF/trace_kernel_trace

# Only the instances that should be running belong here: the gateway's
# recovery runs `fleetctl up` over this whole list. Ports run 8200-8280, then
# from 8400, clear of the K3 fleet's 8300-8390 and 8600 on the same gateway;
# an instance uses its port and the next five.
instances:
  - name: i00
    port: 8200
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i01
    port: 8220
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i02
    port: 8240
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i03
    port: 8260
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i04
    port: 8280
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i05
    port: 8400
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i06
    port: 8420
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i07
    port: 8440
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i08
    port: 8460
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i09
    port: 8480
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  - name: i10
    port: 8500
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
  # A floor the `normal` QoS's within-QoS preemption cannot take. `short` jobs
  # outrank every `normal` one, and no QoS here preempts them. But each runs at
  # most 2 h, and a user holds at most 64 nodes in it: this one plus the K3
  # fleet's hs0/hs1/hs2 make 44. When it ends, the gateway's recovery finds its
  # job gone and runs `fleetctl up`, which submits it again.
  - name: is1
    port: 8540
    topology: server_configs/glm5.3_disagg_4p1d_dep16.yaml
    ctx: server_configs/glm5.3_ctx_dep4_mtp_nvfp4_hostkv8k_conv_f085.yaml
    gen: server_configs/glm5.3_gen_dep16_mtp_nvfp4_f095_cutedsa.yaml
    slurm:
      qos: short
      time: "2:00:00"
